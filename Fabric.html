<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fabric GFS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            background: #f1f3f6;
        }
        /* ================= HEADER ================= */
        .header {
            background: #D6336C;
            color: white;
            padding: 15px 8%;
            display: flex;
            align-items: center;
            gap: 30px;
        }
        .logo {
            font-size: 25px;
            font-weight: bold;
            white-space: nowrap;
        }
        .search {
            flex: 1;
            max-width: 650px;
        }
        .search input {
            width: 100%;
            padding: 12px 15px;
            border: none;
            outline: none;
            border-radius: 3px;
            font-size: 15px;
        }
        /* ================= MAIN ================= */
        .container {
            width: 85%;
            margin: 25px auto;
        }
        .title {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            font-size: 15px;
            font-weight: bold;
        }
        /* ================= PRODUCT GRID ================= */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 18px;
        }
        /* ================= PRODUCT CARD ================= */
        .product-card {
            background: white;
            padding: 15px;
            border-radius: 4px;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        }
        /* ================= PRODUCT IMAGE ================= */
        .product-image {
            width: 100%;
            height: 230px;
            object-fit: contain;
            margin-bottom: 15px;
        }
        /* ================= PRODUCT NAME ================= */
        .product-name {
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        /* ================= DESCRIPTION ================= */
        .description {
            color: #666;
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 10px;
        }
        /* ================= PRICE ================= */
        .price {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 12px;
        }
        .old-price {
            color: #777;
            text-decoration: line-through;
            font-size: 14px;
            margin-left: 8px;
        }
        .discount {
            color: #388e3c;
            font-size: 14px;
            margin-left: 8px;
        }
        /* ================= STOCK LINK/BUTTON ================= */
        .stock-status {
            display: block;
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            margin-top: auto; /* बटन को हमेशा नीचे रखने के लिए */
            text-decoration: none; /* लिंक का अंडरलाइन हटाने के लिए */
            transition: background 0.2s;
        }
        .in-stock {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .in-stock:hover {
            background: #c8e6c9;
        }
        .out-of-stock {
            background: #ffebee;
            color: #c62828;
        }
        .out-of-stock:hover {
            background: #ffcdd2;
        }
        /* ================= NO RESULT ================= */
        #noResult {
            display: none;
            background: white;
            padding: 30px;
            text-align: center;
            font-size: 18px;
            color: #555;
            grid-column: 1 / -1;
        }
        /* ================= RESPONSIVE ================= */
        @media (max-width: 1000px) {
            .product-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
        @media (max-width: 700px) {
            .product-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .container {
                width: 95%;
            }
            .header {
                flex-direction: column;
                align-items: stretch;
            }
            .search {
                max-width: none;
            }
        }
        @media (max-width: 450px) {
            .product-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- ================= HEADER ================= -->
    <header class="header">
        <div class="logo">
            Search
        </div>
        <div class="search">
            <input type="text" id="searchInput" placeholder="Search product by name or code..." autocomplete="off">
        </div>
    </header>

    <!-- ================= MAIN ================= -->
    <main class="container">
        <div class="title">
            God Face Sofa Center Fabric
        </div>

        <!-- ================= PRODUCT LIST ================= -->
        <div class="product-grid" id="productGrid">
            
            <!-- PRODUCT 1 -->
            <div class="product-card">
                <img class="product-image" src="FILAND=N01.jpeg" alt="FILAND=N01">
                <div class="product-name">
                    FILAND=N01
                </div>
                <div class="description">
                    Code - 1
                </div>
                <div class="price">
                    ₹450
                    <span class="old-price"> ₹800 </span>
                </div>
                <!-- नया क्लिकेबल स्टॉक लिंक (यहाँ href में अपना लिंक डालें) -->
                <a href="#" target="_blank" class="stock-status in-stock"> ✔ In Stock (15)</a>
            </div>

            <!-- ================= NO RESULT ================= -->
            <div id="noResult">
                No product found.
            </div>

        </div>
    </main>

    <!-- ================= JAVASCRIPT ================= -->
    <script>
        const searchInput = document.getElementById("searchInput");
        const products = document.querySelectorAll(".product-card");
        const noResult = document.getElementById("noResult");

        /* ================= SEARCH FUNCTIONALITY ================= */
        searchInput.addEventListener("input", function () {
            const searchText = searchInput.value.toLowerCase().trim();
            let foundProducts = 0;

            products.forEach(function (product) {
                const productName = product.querySelector(".product-name").textContent.toLowerCase().trim();
                const productCode = product.querySelector(".description").textContent.toLowerCase().trim();
                const searchableText = productName + " " + productCode;

                if (searchableText.includes(searchText)) {
                    product.style.display = "flex";
                    foundProducts++;
                } else {
                    product.style.display = "none";
                }
            });

            if (foundProducts === 0) {
                noResult.style.display = "block";
            } else {
                noResult.style.display = "none";
            }
        });
    </script>
</body>
</html>
